# ============================================================
# 专业信息收集助手 V3 —— 采集配置
# 对齐《提示词_专业信息收集助手_V3》：27 个领域 / 8 个重点部委 / 约 50 个渠道
# ============================================================

site:
  title: 双碳法规监测
  subtitle: 27 个领域 · 50 余个官方渠道 · 当月法规政策自动收集（V3）

collect:
  month_only: true
  timeout: 40
  retry: 3
  max_candidates: 25
  max_items_per_source: 12
  detail_concurrency: 6
  browser_wait: 3500
  discover_limit: 3
  reference_days: 150

# ------------------------------------------------------------
# 27 个领域（提示词 3.3），命中任一关键词即归属该领域
# ------------------------------------------------------------
domains:
  - {name: 碳达峰碳中和, keys: [碳达峰, 碳中和, 双碳, 全面节约, 碳达峰碳中和]}
  - {name: 碳排放双控, keys: [碳排放双控, 能耗双控, 双控, 碳排放强度]}
  - {name: 全国碳市场, keys: [碳市场, 碳排放权交易, 配额, 履约, 清缴, 扩围]}
  - {name: CCER与碳信用, keys: [CCER, 温室气体自愿减排, 碳信用, 方法学, 减排量]}
  - {name: 产品碳足迹, keys: [碳足迹, 核算规则, 因子数据库, 量化方法]}
  - {name: 碳标识认证, keys: [碳标识, 碳标签]}
  - {name: 绿色工厂与绿色制造, keys: [绿色工厂, 绿色制造, 绿色供应链, 绿色设计]}
  - {name: 零碳工厂与园区, keys: [零碳工厂, 零碳园区, 近零碳, 零碳算力]}
  - {name: 节能降碳, keys: [节能降碳, 节能审查, 能效标杆, 能效, 重点行业]}
  - {name: 工业节能与综合利用, keys: [工业节能, 综合利用, 工业固废, 资源综合利用]}
  - {name: 绿证, keys: [绿证, 绿色电力证书]}
  - {name: 绿电直连与绿电交易, keys: [绿电直连, 绿电直供, 绿电交易, 绿色电力交易, 绿电]}
  - {name: 电力市场与煤电, keys: [电力市场, 现货, 煤电, 电价, 辅助服务]}
  - {name: 氢能, keys: [氢能, 制氢, 加氢站, 氢燃料]}
  - {name: 可再生能源与储能, keys: [可再生能源, 新型储能, 储能, 光伏, 风电]}
  - {name: 循环经济, keys: [循环经济, 园区循环化, 大宗固废, 资源循环]}
  - {name: 再生资源回收利用, keys: [再生资源, 回收利用, 回收体系, 废旧]}
  - {name: 固体废物与危险废物, keys: [固体废物, 危险废物, 固废, 危废]}
  - {name: 再制造（专项）, keys: [再制造, 旧件, 拆解, 五大总成, 再制造件]}
  - {name: 废旧动力电池, keys: [动力电池, 梯次利用, 电池回收]}
  - {name: 臭氧层ODS/HFCs（专项）, keys: [臭氧层, 消耗臭氧层, ODS, HCFCs, HFCs, 氢氟碳化物, 基加利, 蒙特利尔, ODP, 制冷剂, 电子特气]}
  - {name: 新化学物质, keys: [新化学物质, 化学物质环境管理]}
  - {name: 碳计量与能源计量, keys: [碳计量, 能源计量, 计量]}
  - {name: 绿色金融与转型金融, keys: [绿色金融, 转型金融, 绿色债券, 碳金融]}
  - {name: 可持续披露ESG, keys: [可持续披露, ESG, 气候披露, 信息披露]}
  - {name: 认证认可与合格评定, keys: [认证认可, 合格评定, 认可规则]}
  - {name: 生态环境法典与执法, keys: [生态环境法典, 生态环境执法, 执法检查]}

# 8 个重点监控部委（提示词 3.2），用于覆盖度自查
focus_ministries:
  - 中共中央/国务院
  - 国家发展改革委
  - 工业和信息化部
  - 生态环境部
  - 财政部
  - 国家能源局
  - 市场监管总局
  - 商务部

# 排除词：仅剔除人事与纯采购类
exclude: [招聘, 面试, 人事任免, 感谢信, 中标结果, 成交公告, 采购公告, 竞争性磋商, 标准文本查阅, 专家征集]

# ------------------------------------------------------------
# 信息源（约 50 个，覆盖提示词 3.1）
# ------------------------------------------------------------
sources:
  # ===== 顶层 =====
  # 全国人大「法律草案征求意见」：页面为 JS 渲染，直接对接其 JSON 接口（flag=0 正在征求意见）
  - group: 顶层
    name: 全国人大法律草案征求意见
    region: 国家
    org: 全国人大及其常委会
    adapter: api
    url: "http://www.npc.gov.cn/flcaw/"
    keywords_any: [能源, 环境, 生态, 碳, 气候, 电力, 资源, 节约, 循环, 清洁, 可再生, 氢, 排放, 污染, 固体废物, 节能, 绿色]
    default_domain: 碳达峰碳中和
    api:
      list: "http://www.npc.gov.cn/flcaw/flca-list?flag=0&type=0&page=1&per_page=100"
      title_field: flxxmc
      date_field: ksrq
      id_field: flxxId
      link: "http://www.npc.gov.cn/flcaw/userIndex.html?lid={id}"
      note: "征求意见期 {ksrq} 至 {jsrq}；已有 {gzrs} 人参与、收到 {gzyj} 条意见"

  - {group: 顶层, name: 中国政府网, region: 国家, org: 国务院, adapter: browser, url: "https://www.gov.cn/zhengce/zuixin/"}
  - {group: 顶层, name: 全国人大网, region: 国家, org: 全国人大及其常委会, adapter: html, url: "http://www.npc.gov.cn/"}
  - {group: 顶层, name: 司法部, region: 国家, org: 司法部, adapter: html, url: "https://www.moj.gov.cn/flfggz/flfggzbmgz/"}
  - {group: 顶层, name: 国家法律法规数据库, region: 国家, org: 全国人大, adapter: browser, url: "https://flk.npc.gov.cn/", enabled: false, note: "全库为 JS 单页应用，列表接口需交互参数，暂以全国人大网替代"}

  # ===== 部委 =====
  - {group: 部委, name: 国家发展改革委, region: 国家, org: 国家发展改革委, adapter: html, url: "https://www.ndrc.gov.cn/xxgk/zcfb/tz/", urls: ["https://www.ndrc.gov.cn/xxgk/zcfb/gg/", "https://www.ndrc.gov.cn/xxgk/zcfb/fzggwl/"]}
  - {group: 部委, name: 工业和信息化部, region: 国家, org: 工业和信息化部, adapter: browser, url: "https://www.miit.gov.cn/zwgk/zcwj/index.html", urls: ["https://www.miit.gov.cn/zwgk/wjgs/index.html"]}
  - {group: 部委, name: 生态环境部, region: 国家, org: 生态环境部, adapter: html, url: "https://www.mee.gov.cn/zcwj/", urls: ["https://www.mee.gov.cn/zcwj/bwj/", "https://www.mee.gov.cn/zcwj/gwywj/"]}
  - {group: 部委, name: 财政部, region: 国家, org: 财政部, adapter: html, url: "https://www.mof.gov.cn/zhengwuxinxi/zhengcefabu/"}
  - {group: 部委, name: 自然资源部, region: 国家, org: 自然资源部, adapter: html, url: "https://www.mnr.gov.cn/"}
