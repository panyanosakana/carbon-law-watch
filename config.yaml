  - {group: 部委, name: 商务部, region: 国家, org: 商务部, adapter: html, url: "https://www.mofcom.gov.cn/zcfb/index.html"}
  - {group: 部委, name: 国家能源局, region: 国家, org: 国家能源局, adapter: browser, url: "https://www.nea.gov.cn/zcfb/"}
