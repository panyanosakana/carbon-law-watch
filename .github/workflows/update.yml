name: carbon-law-update

# 每天北京时间 08:00（UTC 00:00）自动采集；也可在 Actions 页手动触发
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r collector/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 运行采集
        run: python collector/engine_v3.py

      - name: 提交数据与 Excel
        run: |
          git config user.name  "carbon-law-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/data/ output/ "双碳法规监测-单文件版.html"
          git commit -m "法规更新 $(date -u +%F)" || exit 0
          # 远端若有新提交（如人工改了配置），先变基再推
          git pull --rebase origin main || { git rebase --abort; git pull --rebase=false --no-edit origin main; }
          git push

      - name: 上传 Excel 附件
        uses: actions/upload-artifact@v4
        with:
          name: carbon-law-excel
          path: output/*.xlsx
          retention-days: 30
